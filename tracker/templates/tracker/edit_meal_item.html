<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #FFF7F5;
    font-family: 'Inter', sans-serif;
    color: #241E28;
}

.page-wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 60px;
}

.page-eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #E8447A;
    margin: 0 0 4px;
}

.page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 0.02em;
    margin: 0 0 24px;
    line-height: 1;
}

.card {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(36, 30, 40, 0.06);
}

.card form p {
    margin: 0 0 16px;
}

.card form label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #8A7E88;
    margin-bottom: 6px;
}

.card form select,
.card form input[type="number"],
.card form input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #EBDEE3;
    background: #FFF7F5;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: #241E28;
}

.card form select:focus,
.card form input:focus {
    outline: none;
    border-color: #E8447A;
}

.submit-btn {
    width: 100%;
    background: #E8447A;
    color: #FFFFFF;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
}

.submit-btn:hover {
    background: #c9366a;
    transform: translateY(-2px);
}

.done-link {
    display: inline-block;
    margin-top: 18px;
    color: #241E28;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    border-bottom: 2px solid #FFC93C;
    padding-bottom: 2px;
}

.current-food-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #8A7E88;
    margin-bottom: 6px;
}

.current-food-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #EBDEE3;
    background: #FFF7F5;
    margin-bottom: 16px;
}

.current-food-name {
    font-size: 15px;
    font-weight: 600;
    color: #241E28;
}

.change-btn {
    background: #241E28;
    color: #FFF7F5;
    border: none;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
}

.change-btn:hover {
    background: #3a3140;
}

.search-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #8A7E88;
    margin-bottom: 6px;
}

.search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.search-row input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #EBDEE3;
    background: #FFF7F5;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: #241E28;
}

.search-row input[type="text"]:focus {
    outline: none;
    border-color: #E8447A;
}

.search-row button {
    background: #241E28;
    color: #FFF7F5;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 0 12px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
}

.search-results {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.search-result-item {
    background: #FFF7F5;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
}

.search-result-item:hover {
    border-color: #E8447A;
}

.search-result-item .result-name {
    display: block;
    font-weight: 600;
    color: #241E28;
}

.search-result-item .result-cal {
    display: block;
    font-size: 12px;
    color: #8A7E88;
}

.selected-food-msg {
    font-size: 13px;
    font-weight: 600;
    color: #2AA876;
    margin: 10px 0 0;
}

/* The Food dropdown is still submitted with the form, but we show our
   own "current food" row + search UI instead of the raw dropdown. */
.card form label[for="id_food"],
#id_food {
    display: none;
}
</style>

<div class="page-wrap">
    <p class="page-eyebrow">Edit a food item</p>
    <h2 class="page-title">Edit Meal Item</h2>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <p class="current-food-label">Food</p>
            <div class="current-food-row" id="current-food-row">
                <span class="current-food-name" id="current-food-name">{% if meal_item.food %}{{ meal_item.food.food_name }}{% else %}Deleted Food{% endif %}</span>
                <button class="change-btn" type="button" id="change-food-btn">Change</button>
            </div>

            <div id="food-search-section" style="display: none;">
                <p class="search-label">Search Food</p>
                <div class="search-row">
                    <input type="text" id="food-search-input" placeholder="e.g. chicken breast">
                    <button type="button" id="food-search-btn">Search All</button>
                </div>
                <ul class="search-results" id="food-search-results"></ul>
                <button type="button" id="load-more-btn" style="display: none; width: 100%; margin-top: 8px; background: #FFF7F5; color: #241E28; border: 1px solid #EBDEE3; border-radius: 10px; padding: 10px; cursor: pointer;">Load More</button>
                <p class="selected-food-msg" id="selected-food-msg" style="display: none;"></p>
            </div>

            {{ meal_item_form.as_p }}
            <button class="submit-btn" type="submit">Save</button>
        </form>
    </div>

    <a class="done-link" href="{% url 'tracker:meal_log' %}">Back to Meal Log</a>
</div>

<script>
    // "Change" butonuna basınca, mevcut yiyecek gösterimini gizleyip,
    // arama alanını gösteriyoruz.
    var changeBtn = document.getElementById("change-food-btn");
    changeBtn.addEventListener("click", function() {
        document.getElementById("current-food-row").style.display = "none";
        document.getElementById("food-search-section").style.display = "block";
    });

    function selectExistingFood(id, name) {
        var foodDropdown = document.getElementById("id_food");
        foodDropdown.value = id;
        var msgBox = document.getElementById("selected-food-msg");
        msgBox.innerHTML = "Selected: " + name;
        msgBox.style.display = "block";
    }

    function createFoodResultItem(food) {
        var listItem = document.createElement("li");
        listItem.className = "search-result-item";
        listItem.innerHTML = "<span class='result-name'>" + food.name + "</span><span class='result-cal'>" + food.calories + " kcal/100g</span>";
        listItem.addEventListener("click", function() {
            if (food.usda_id){
                var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                fetch("{% url 'tracker:create_food_from_usda' %}", {
                    method: "POST",
                    headers: {"X-CSRFToken": csrfToken, "Content-Type": "application/x-www-form-urlencoded"},
                    body: "name=" + food.name + "&calories=" + food.calories
                })
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    var foodDropdown = document.getElementById("id_food");
                    var newOption = document.createElement("option");
                    newOption.value = data.id;
                    newOption.innerHTML = food.name;
                    foodDropdown.appendChild(newOption);
                    foodDropdown.value = data.id;
                    var msgBox = document.getElementById("selected-food-msg");
                    msgBox.innerHTML = "Selected: " + food.name;
                    msgBox.style.display = "block";
                });
            }
            else{
                selectExistingFood(food.id, food.name);
            }
        });
        return listItem;
    }

    var currentPage = 1;
    var currentQuery = "";

    function performSearch(page, append) {
        var url = "/tracker/search-food/?query=" + currentQuery + "&page=" + page;
        fetch(url)
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                var resultsList = document.getElementById("food-search-results");
                if (!append) {
                    resultsList.innerHTML = "";
                }
                data.results.forEach(function(food) {
                    var listItem = createFoodResultItem(food);
                    resultsList.appendChild(listItem);
                });

                var loadMoreBtn = document.getElementById("load-more-btn");
                if (page < data.total_pages) {
                    loadMoreBtn.style.display = "block";
                } else {
                    loadMoreBtn.style.display = "none";
                }
            });
    }

    var searchButton = document.getElementById("food-search-btn");
    searchButton.addEventListener("click", function() {
        var searchBox = document.getElementById("food-search-input");
        currentQuery = searchBox.value;
        currentPage = 1;
        performSearch(currentPage, false);
    });

    var loadMoreBtn = document.getElementById("load-more-btn");
    loadMoreBtn.addEventListener("click", function() {
        currentPage = currentPage + 1;
        performSearch(currentPage, true);
    });
</script>
